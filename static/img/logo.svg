<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="go-hiera">
  <defs>
    <linearGradient id="hiera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#hiera)"/>
  <!-- Hiera hierarchy: three stacked rounded bars narrowing top to bottom -->
  <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round">
    <line x1="70" y1="88"  x2="186" y2="88"/>
    <line x1="86" y1="128" x2="170" y2="128"/>
    <line x1="102" y1="168" x2="154" y2="168"/>
  </g>
</svg>
